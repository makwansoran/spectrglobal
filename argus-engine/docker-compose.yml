services:
  argus-engine:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./samples:/app/samples
      - ./evidence:/app/evidence
      - ./.env:/app/.env:ro
    # Uncomment on a GPU host with NVIDIA Container Toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped
